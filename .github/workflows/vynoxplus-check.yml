name: VynoxPlus Worker Check

on:
  push:
    paths:
      - "vynoxplus-bot/**"
      - ".github/workflows/vynoxplus-check.yml"
  pull_request:
    paths:
      - "vynoxplus-bot/**"
      - ".github/workflows/vynoxplus-check.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check Worker JavaScript syntax
        run: node --check src/index.js
        working-directory: vynoxplus-bot
      - name: Validate package.json
        run: node -e "JSON.parse(require('node:fs').readFileSync('package.json', 'utf8'))"
        working-directory: vynoxplus-bot
