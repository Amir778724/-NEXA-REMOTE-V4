name: Android build

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout app
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK and NDK
        uses: android-actions/setup-android@v4
      - name: Install Android NDK
        run: sdkmanager "ndk;27.2.12479018"

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.27.3"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build libXray Android library
        run: |
          git clone --depth 1 --branch v26.11.9 https://github.com/XTLS/libXray.git /tmp/libXray
          cd /tmp/libXray
          python3 build/main.py android
          mkdir -p "$GITHUB_WORKSPACE/app/libs"
          cp libXray.aar "$GITHUB_WORKSPACE/app/libs/libXray.aar"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: nexa-remote-v4-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
