name: Android build

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout app
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Download verified libXray Android release
        run: |
          set -euo pipefail
          curl -fL --retry 3 \
            https://github.com/XTLS/libXray/releases/download/v26.11.9/libxray-android.zip \
            -o /tmp/libxray-android.zip
          echo "1b1aa12124a7112af983a6cea74c77f27aadc6b650acf3c5a57019619ba9fa48  /tmp/libxray-android.zip" | sha256sum -c -
          mkdir -p /tmp/libxray-release app/libs
          unzip -q /tmp/libxray-android.zip -d /tmp/libxray-release
          AAR="$(find /tmp/libxray-release -type f -name libXray.aar -print -quit)"
          test -n "$AAR"
          cp "$AAR" app/libs/libXray.aar
          test -s app/libs/libXray.aar

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: nexa-remote-v4-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
